name: Collect DART data and publish dashboard

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dart-dashboard
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch annual consolidated DART data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/fetch_dart.py
      - name: Commit refreshed public data and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/financials.json data/raw report/analysis.md
          if ! git diff --cached --quiet; then
            git commit -m "Refresh DART annual financial data and analysis"
            git push
          fi
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
